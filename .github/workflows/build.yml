name: Build & Release (Windows)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Required to create releases / tags / upload assets.
permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # shrink CI cache footprint
  CARGO_NET_RETRY: 3

jobs:
  build:
    name: Build Windows installer (.exe) and publish to Releases
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-windows-

      - name: Install npm dependencies
        # No package-lock.json is committed (the sandbox can't generate one),
        # so we use `npm install` instead of `npm ci`. This also writes a
        # package-lock.json on the first run; commit it afterwards to switch
        # back to `npm ci` for reproducible installs.
        run: npm install --no-audit --no-fund

      - name: Build frontend
        # Must run BEFORE any `cargo` step: `tauri::generate_context!()`
        # reads `frontendDist: "../dist"` at compile time and panics if the
        # directory does not exist.
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast

      - name: Build Tauri app (debug smoke)
        working-directory: src-tauri
        run: cargo build --lib

      - name: Build Tauri bundle (release MSI + NSIS .exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-signing keys for the built-in updater. Optional: leave empty
          # until you configure `plugins.updater` in tauri.conf.json. Generate
          # with `npx @tauri-apps/cli signer generate` and store as repo
          # secrets before tagging a release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No `tagName` here → the action only BUILDS, it does not create a
          # release. We publish the release ourselves below for full control.
          args: --target x86_64-pc-windows-msvc

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret-gui-windows-msi
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret-gui-windows-exe
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # ---------------------------------------------------------------------
      # Release publishing.
      #
      # Skipped on pull requests (we only build artifacts there).
      #   • push to main/master → rolling "nightly" prerelease (overwritten each run)
      #   • push of a v* tag     → proper release marked as latest
      # ---------------------------------------------------------------------
      - name: Compute release tag
        if: github.event_name != 'pull_request'
        id: reltag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag=${tag}"              >> "$GITHUB_OUTPUT"
            echo "name=Zapret GUI ${tag}"  >> "$GITHUB_OUTPUT"
            echo "prerelease=false"        >> "$GITHUB_OUTPUT"
            echo "make_latest=true"        >> "$GITHUB_OUTPUT"
            echo "body=Zapret GUI ${tag} — Windows installer (.exe + .msi)." >> "$GITHUB_OUTPUT"
          else
            short=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "tag=nightly"                                             >> "$GITHUB_OUTPUT"
            echo "name=Nightly build (${short})"                           >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                                         >> "$GITHUB_OUTPUT"
            echo "make_latest=false"                                       >> "$GITHUB_OUTPUT"
            echo "body=Rolling nightly build from ${GITHUB_REF} @ ${short}. Not a stable release." >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release with .exe and .msi
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: ${{ steps.reltag.outputs.name }}
          body: ${{ steps.reltag.outputs.body }}
          prerelease: ${{ steps.reltag.outputs.prerelease }}
          make_latest: ${{ steps.reltag.outputs.make_latest }}
          # softprops/action-gh-release overwrites assets that already exist
          # on the same release — important for the rolling nightly tag.
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
