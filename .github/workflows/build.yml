name: Build & Release (Windows)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Required to create releases / tags / upload assets.
permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 3

jobs:
  # ---------------------------------------------------------------------------
  # Stable release (push of a v* tag).
  #
  # Builds the signed NSIS .exe + MSI, generates the `latest.json` updater
  # manifest, and creates a non-draft, non-prerelease GitHub Release. This is
  # the release the in-app updater points at via
  #   https://github.com/<owner>/<repo>/releases/latest/download/latest.json
  # ---------------------------------------------------------------------------
  release:
    name: Release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-windows-

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Inject updater config (repo + pubkey) into tauri.conf.json
        # tauri.conf.json carries two placeholders that are resolved at build
        # time so you never have to hand-edit the config:
        #   __REPO__   -> "<owner>/<repo>"  (from github.repository)
        #   __PUBKEY__ -> the updater public key (repo secret TAURI_UPDATER_PUBKEY)
        # If the secret is unset, pubkey becomes empty and the updater stays
        # dormant (the app still builds and runs).
        shell: bash
        env:
          REPO: ${{ github.repository }}
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          python - <<'PY'
          import json, os
          path = "src-tauri/tauri.conf.json"
          # Read as BYTES so json.loads auto-detects the encoding via the BOM
          # (UTF-8 / UTF-16 / UTF-32). Some Windows editors save
          # tauri.conf.json as UTF-16 LE (FF FE BOM), which makes a plain
          # `open(path, encoding="utf-8").read()` raise
          # "UnicodeDecodeError: 'utf-8' codec can't decode byte 0xff".
          # We then rewrite the file as clean UTF-8 (no BOM) so the later
          # `cargo build` / generate_context! also sees a normal file.
          raw = open(path, "rb").read()
          cfg = json.loads(raw)
          upd = cfg.setdefault("plugins", {}).setdefault("updater", {})
          repo = os.environ["REPO"]
          pubkey = os.environ.get("PUBKEY", "")
          upd["endpoints"] = [f"https://github.com/{repo}/releases/latest/download/latest.json"]
          upd["pubkey"] = pubkey
          with open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write(json.dumps(cfg, indent=2, ensure_ascii=False))
              f.write("\n")
          print("endpoint ->", upd["endpoints"][0])
          print("pubkey set ->", bool(pubkey))
          PY

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast

      - name: Build, sign and publish release (NSIS .exe + MSI + latest.json)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing key for the updater. The build signs the NSIS/MSI bundles
          # and emits *.sig files; tauri-action then writes latest.json
          # referencing them. Generate with `npx @tauri-apps/cli signer generate`
          # and store the private key + password as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Zapret GUI v__VERSION__"
          releaseBody: "Zapret GUI v__VERSION__ — Windows installer (.exe + .msi). See the assets below. The in-app updater points at this release automatically."
          releaseDraft: false
          prerelease: false
          # Prefer the NSIS .exe in latest.json (single-file installer).
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc

      - name: Ensure latest.json updater manifest exists (fallback)
        # tauri-action normally emits latest.json when the signing key +
        # updaterJsonPreferNsis are set. As a guaranteed fallback (and to
        # repair releases where it silently wasn't uploaded — e.g. an empty
        # TAURI_UPDATER_PUBKEY), build it ourselves from the signed NSIS
        # .exe + .sig and upload ONLY if the release doesn't already carry one.
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'latest.json'; then
            echo "latest.json already present on release $TAG — nothing to do"
            exit 0
          fi
          echo "latest.json missing — generating from signed NSIS bundle"
          python - <<'PY'
          import json, os, glob, urllib.parse, datetime, sys
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version = tag.lstrip("v")
          nsis_dir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          exes = sorted(glob.glob(os.path.join(nsis_dir, "*-setup.exe")))
          if not exes:
              print("no NSIS *-setup.exe found under", nsis_dir, "— cannot build latest.json")
              sys.exit(1)
          exe = exes[0]
          exe_name = os.path.basename(exe)
          sig_path = exe + ".sig"
          sig = open(sig_path, encoding="utf-8").read().strip() if os.path.exists(sig_path) else ""
          if not sig:
              print("WARNING: .sig missing for", exe_name, "— the updater will reject this build")
          url = f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(exe_name)}"
          manifest = {
              "version": version,
              "notes": f"Zapret GUI v{version}",
              "pub_date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": sig,
                      "url": url,
                  }
              },
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$TAG" latest.json --clobber

  # ---------------------------------------------------------------------------
  # Nightly build (push to main/master).
  #
  # Rolling prerelease tagged `nightly`, overwritten each run. Delivers the
  # latest .exe/.msi for testing but is NOT wired to the in-app updater
  # (auto-update only follows the stable `latest` release).
  # ---------------------------------------------------------------------------
  nightly:
    name: Nightly (main)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize tauri.conf.json encoding
        # Some Windows editors save tauri.conf.json as UTF-16 (FF FE BOM),
        # which breaks both json.load() and Rust's generate_context!().
        # Rewrite it as clean UTF-8 (no BOM) before any build step.
        shell: bash
        run: |
          python - <<'PY'
          import json
          path = "src-tauri/tauri.conf.json"
          cfg = json.loads(open(path, "rb").read())  # auto-detects UTF-8/16/32 via BOM
          with open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write(json.dumps(cfg, indent=2, ensure_ascii=False))
              f.write("\n")
          print("tauri.conf.json normalized to UTF-8")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-windows-

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast

      - name: Build Tauri bundle (MSI + NSIS .exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No tagName -> build only, no release creation here.
          args: --target x86_64-pc-windows-msvc

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: Nightly build (${{ github.sha }})
          body: |
            Rolling nightly build from ${{ github.sha }}.
            Not a stable release — the in-app updater ignores it.
            Download the `.exe` installer below to test the latest main.
          prerelease: true
          make_latest: false
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  # ---------------------------------------------------------------------------
  # Pull-request build (artifacts only, no release).
  # ---------------------------------------------------------------------------
  pr:
    name: Build (PR)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize tauri.conf.json encoding
        # Some Windows editors save tauri.conf.json as UTF-16 (FF FE BOM),
        # which breaks both json.load() and Rust's generate_context!().
        # Rewrite it as clean UTF-8 (no BOM) before any build step.
        shell: bash
        run: |
          python - <<'PY'
          import json
          path = "src-tauri/tauri.conf.json"
          cfg = json.loads(open(path, "rb").read())  # auto-detects UTF-8/16/32 via BOM
          with open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write(json.dumps(cfg, indent=2, ensure_ascii=False))
              f.write("\n")
          print("tauri.conf.json normalized to UTF-8")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-windows-

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret-gui-windows-msi
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret-gui-windows-exe
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
