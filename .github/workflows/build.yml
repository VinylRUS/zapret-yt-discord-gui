name: Build (Windows)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # shrink CI cache footprint
  CARGO_NET_RETRY: 3

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: cargo-windows-

      - name: Install npm dependencies
        # No package-lock.json is committed (the sandbox can't generate one),
        # so we use `npm install` instead of `npm ci`. This also writes a
        # package-lock.json on the first run; commit it afterwards to switch
        # back to `npm ci` for reproducible installs.
        run: npm install --no-audit --no-fund

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (debug smoke)
        working-directory: src-tauri
        run: cargo build --lib

      - name: Build Tauri bundle (release MSI + NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For the updater plugin — generate with `tauri signer generate`
          # and store as a repository secret before tagging a release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__CI__
          releaseName: "Zapret GUI v__VERSION__"
          releaseBody: "See the assets below to download the Windows installer."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret-gui-windows-msi
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret-gui-windows-nsis
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
