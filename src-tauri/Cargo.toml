[package]
name = "zapret-gui"
version = "1.0.0"
description = "GUI for zapret DPI bypass (Discord/YouTube)"
authors = ["Zapret GUI"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zapret_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
zip = "2"
flate2 = "1"
tar = "0.4"
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Services",
] }
windows-service = "0.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# NOTE: do NOT set `panic = "abort"` here. With abort, any panic (including
# in background tokio tasks) kills the process instantly with no dialog and
# no log — the app silently disappears from the tray. The default `unwind`
# lets the crash hook in src/crash.rs write panic.log + show a MessageBox,
# and lets a panicking background task die without taking the whole app with it.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
